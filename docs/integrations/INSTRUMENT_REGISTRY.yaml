schema_version: 1
instruments:
  - id: ARC-INSTRUMENT-RUNTIME-LAB
    name: ARCONT Runtime Lab
    kind: controlled-benchmark
    upstream: https://github.com/heliossamuelhernandezreyes/Nia-Tech
    role:
      - preregistered-microbenchmark
      - falsifiable-sweep
      - canonical-runtime-evidence
    ingestion: unified-evidence-kernel
    evidence_policy: canonical-raw-hash-required

  - id: ARC-INSTRUMENT-GODOT-BENCHMARKS
    name: Godot Benchmarks
    kind: benchmark-suite
    upstream: https://github.com/godotengine/godot-benchmarks
    role:
      - upstream-comparison
      - regression-context
      - hypothesis-generation
    ingestion: unified-evidence-kernel
    evidence_policy: external-provenance-required

  - id: ARC-INSTRUMENT-PERFETTO
    name: Perfetto
    kind: trace-profiler
    upstream: https://perfetto.dev/
    godot_role:
      - android-system-tracing
      - thread-scheduling
      - cpu-frequency
      - trace-events
    ingestion: unified-evidence-kernel-via-trace-extract
    evidence_policy: raw-trace-hash-required

  - id: ARC-INSTRUMENT-TRACY
    name: Tracy
    kind: trace-profiler
    upstream: https://github.com/wolfpld/tracy
    godot_role:
      - cross-platform-cpu-tracing
      - sampling
      - hotspot-analysis
    ingestion: unified-evidence-kernel-via-trace-extract
    evidence_policy: raw-trace-hash-required

kernel:
  tool: tools/evidence_ingest.py
  evidence_record_schema: schemas/external-evidence.schema.json
  bundle_schema: schemas/evidence-bundle.schema.json
  trace_extract_schema: schemas/trace-extract.schema.json
  invariant: every provider becomes the same evidence record shape before interpretation

rules:
  semantic_equivalence_must_be_explicit: true
  unknown_provenance_must_remain_unknown: true
  external_tools_can_auto_promote_maturity: false
  runtime_lab_can_auto_promote_maturity: false
  raw_profiler_screenshots_are_canonical_evidence: false
