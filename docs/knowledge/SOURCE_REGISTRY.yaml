future_source_families:
  - Khronos Vulkan and OpenGL specifications/guides
  - WebGPU/W3C specifications where relevant
  - GDC Vault technical talks
  - ACM SIGGRAPH papers and courses
  - GPU vendor technical guides from AMD, NVIDIA, Intel, Arm and Qualcomm
  - platform guidance from Microsoft Xbox, Sony and Nintendo where publicly accessible
  - reproducible open-source engines and middleware
  - peer-reviewed AI, graphics, simulation, networking and procedural-generation literature
