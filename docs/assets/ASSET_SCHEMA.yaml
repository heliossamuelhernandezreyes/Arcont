schema_version: 1
asset_record:
  id: ARC-ASSET-UNIQUE-ID
  title: null
  asset_type: null
  dimensions: []
  themes: []
  styles: []
  tags: []
  source:
    provider: null
    author: null
    asset_url: null
    download_url: null
    acquired_at: null
  license:
    name: null
    version: null
    license_url: null
    commercial_use: null
    modification: null
    attribution_required: null
    redistribution_allowed: null
    share_alike: null
    ai_training_allowed: null
    notes: null
  technical:
    formats: []
    texture_resolution: null
    triangle_count: null
    rigged: null
    animated: null
    animation_count: null
    pbr: null
    lods: null
    collision: null
    audio_sample_rate: null
    audio_channels: null
    font_formats: []
  compatibility:
    godot: null
    unreal: null
    unity: null
    web: null
    android: null
  compatibility_evidence:
    godot:
      level: null
      basis: null
      tested_at: null
      evidence_ref: null
  archive:
    mirrored_in_arcont: false
    local_path: null
    sha256: null
    size_bytes: null
  review:
    license_verified: false
    metadata_verified: false
    last_checked: null
    notes: null

compatibility_levels:
  inferred: expected compatibility based on metadata or general platform knowledge; not runtime proof
  format: format/import-path compatibility has a concrete technical basis; still not runtime proof
  runtime: asset was actually tested on the target and must carry tested_at plus evidence_ref

rules:
  - unknown values are null, never guessed
  - asset-level license overrides provider-level assumptions
  - no binary mirroring unless redistribution is explicitly permitted
  - preserve license evidence and acquisition date
  - commercial_use and redistribution_allowed are separate concepts
  - attribution obligations must be machine-readable
  - compatibility true does not by itself mean runtime verified
  - legacy compatibility claims without compatibility_evidence are legacy-unverified
  - runtime compatibility requires tested_at and evidence_ref
