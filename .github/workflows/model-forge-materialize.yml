name: Model Forge Materialize

on:
  workflow_dispatch:
    inputs:
      record:
        description: Asset Vault record path
        required: true
        default: assets/catalog/kenney/castle-kit.asset.json
      url:
        description: Verified direct archive/model URL
        required: true

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize catalogued asset
        run: python tools/model_forge_materialize.py "$RECORD" --url "$SOURCE_URL" --out model-forge-work
        env:
          RECORD: ${{ inputs.record }}
          SOURCE_URL: ${{ inputs.url }}
      - name: Preserve reproducible evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-forge-${{ github.run_id }}
          path: model-forge-work/
          if-no-files-found: error
          retention-days: 14
