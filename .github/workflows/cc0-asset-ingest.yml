name: CC0 Asset Ingest

on:
  push:
    branches: [assets/cc0-staging]
    paths:
      - '.github/workflows/cc0-asset-ingest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: assets/cc0-staging

      - name: Install extraction helpers
        run: |
          python -m pip install --quiet gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Download deterministic CC0 packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arcont_cc0
          cd /tmp/arcont_cc0
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o guns.zip 'https://opengameart.org/sites/default/files/ultimate_gun_pack_by_quaternius.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o animations.zip 'https://opengameart.org/sites/default/files/universal_animation_library_2standard.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o roads.zip 'https://opengameart.org/sites/default/files/kenney_city-kit-roads_0.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o industrial.zip 'https://opengameart.org/sites/default/files/kenney_city-kit-industrial_1.0.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o factory.zip 'https://opengameart.org/sites/default/files/kenney_factory-kit_3.0.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o trashcan.zip 'https://opengameart.org/sites/default/files/trashcan_yethiel.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o street_clutter.zip 'https://opengameart.org/sites/default/files/lamppostbenchtrashcan_fbx_gltf_textures_blend.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o paper_debris.zip 'https://opengameart.org/sites/default/files/paper_debris.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o city_zombie.7z 'https://opengameart.org/sites/default/files/Male%20City%20Zombie.7z'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o mobile_zombie.zip 'https://opengameart.org/sites/default/files/Zombie.zip'

      - name: Download human-scale Quaternius candidate mirror
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/arcont_cc0
          # Audited CC0 redistribution derived from Quaternius Universal Base Characters.
          # This is a staging reference, not a substitute for the complete official free pack.
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 \
            -o quaternius_ubc_candidate.glb \
            'https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/night-striker.glb'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 60 \
            -o quaternius_ubc_license.txt \
            'https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/LICENSE-BASE-CHARACTERS.txt'

      - name: Download official Universal Base Characters best effort
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd /tmp/arcont_cc0
          for url in \
            'https://quaternius.itch.io/universal-base-characters/file/Universal%20Base%20Characters%5BStandard%5D.zip' \
            'https://quaternius.com/assets/packs/Universal%20Base%20Characters%5BStandard%5D.zip'; do
            curl -L --fail --retry 2 --connect-timeout 20 --max-time 240 -o universal_base_characters.zip "$url" && exit 0
          done
          rm -f universal_base_characters.zip
          exit 0

      - name: Download Zombie Apocalypse Kit best effort
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd /tmp/arcont_cc0
          mkdir -p zombie_drive
          timeout 75s gdown --folder 'https://drive.google.com/drive/folders/1mWP6sCHun7OUMHQeDNZLrXTteXlzWg_t?usp=sharing' -O zombie_drive
          exit 0

      - name: Add or refresh packs without deleting warehouse history
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/assets/cc0_staging"
          mkdir -p "$ROOT/vendor"/{weapons,animations,characters_zombies,environment_roads,environment_industrial,environment_factory,props_trashcan,props_street_clutter,props_paper,human_scale_characters,realistic_infected,mobile_infected_reference,realistic_environment_manifest}
          cd /tmp/arcont_cc0

          # IMPORTANT: never rm -rf vendor/. The warehouse is a reusable cross-project library.
          # Extraction is additive/idempotent and package-scoped.
          unzip -oq guns.zip -d "$ROOT/vendor/weapons/quaternius_ultimate_guns"
          unzip -oq animations.zip -d "$ROOT/vendor/animations/quaternius_universal_animation_library_2"
          unzip -oq roads.zip -d "$ROOT/vendor/environment_roads/kenney_city_kit_roads"
          unzip -oq industrial.zip -d "$ROOT/vendor/environment_industrial/kenney_city_kit_industrial"
          unzip -oq factory.zip -d "$ROOT/vendor/environment_factory/kenney_factory_kit"
          unzip -oq trashcan.zip -d "$ROOT/vendor/props_trashcan/yethiel_trashcan"
          unzip -oq street_clutter.zip -d "$ROOT/vendor/props_street_clutter/loafbrr_street_clutter"
          unzip -oq paper_debris.zip -d "$ROOT/vendor/props_paper/paul_wortmann_paper_debris"
          7z x -y city_zombie.7z -o"$ROOT/vendor/realistic_infected/rikindle3d_male_city_zombie" >/dev/null
          unzip -oq mobile_zombie.zip -d "$ROOT/vendor/mobile_infected_reference/lucian_pavel_mobile_zombie"

          mkdir -p "$ROOT/vendor/human_scale_characters/quaternius_universal_base_candidate_mirror"
          cp quaternius_ubc_candidate.glb "$ROOT/vendor/human_scale_characters/quaternius_universal_base_candidate_mirror/night-striker-reference.glb"
          cp quaternius_ubc_license.txt "$ROOT/vendor/human_scale_characters/quaternius_universal_base_candidate_mirror/LICENSE-BASE-CHARACTERS.txt"
          cat > "$ROOT/vendor/human_scale_characters/quaternius_universal_base_candidate_mirror/README.md" <<'EOF'
          # Universal Base Characters — CC0 staging reference
          This GLB is an audited redistribution/derivative reference based on Quaternius Universal Base Characters.
          Original source: https://quaternius.com/packs/universalbasecharacters.html
          Mirror provenance: https://github.com/Seyamalam/blood-league-kickoff
          It exists only so Arcont can test human scale, rig compatibility and geometry while the complete official free pack lacks a stable scripted download URL.
          Do not describe this single derivative as the full Universal Base Characters pack.
          EOF

          if [ -s universal_base_characters.zip ]; then
            mkdir -p "$ROOT/vendor/human_scale_characters/quaternius_universal_base_characters_official"
            unzip -oq universal_base_characters.zip -d "$ROOT/vendor/human_scale_characters/quaternius_universal_base_characters_official" || true
          fi
          if [ -d zombie_drive ] && [ "$(find zombie_drive -type f | wc -l)" -gt 0 ]; then
            mkdir -p "$ROOT/vendor/characters_zombies/quaternius_zombie_apocalypse"
            cp -an zombie_drive/. "$ROOT/vendor/characters_zombies/quaternius_zombie_apocalypse/" || true
          fi

          cat > "$ROOT/vendor/realistic_environment_manifest/README.md" <<'EOF'
          # Realistic environment CC0 source pool
          Poly Haven is approved as a CC0 source pool for realistic PBR materials, HDRIs and selected props.
          Curated Arcont candidates: asphalt_02, concrete_floor_damaged_01, rubble, trashbag and metal_trash_can.
          High-resolution source originals are intentionally not mirrored wholesale into Git; game-sized derivatives should be ingested per concrete production need.
          Existing Kenney environment packs remain permanently preserved in the warehouse.
          EOF

      - name: Write ingestion inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('assets/cc0_staging/vendor')
          lines=['# Generated CC0 staging inventory','', 'Generated by `cc0-asset-ingest.yml`. Warehouse assets are not production-approved until audited.','']
          total=0
          for category in sorted([p for p in root.iterdir() if p.is_dir()]):
              files=[f for f in category.rglob('*') if f.is_file()]
              size=sum(f.stat().st_size for f in files); total += size
              lines += [f'## {category.name}', f'- files: {len(files)}', f'- size: {size/1024/1024:.2f} MiB']
              exts={}
              for f in files:
                  ext=f.suffix.lower() or '<none>'; exts[ext]=exts.get(ext,0)+1
              lines += ['- formats: '+(', '.join(f'{k}={v}' for k,v in sorted(exts.items())) if exts else 'none'), '']
          lines.append(f'**Total staged size:** {total/1024/1024:.2f} MiB')
          Path('assets/cc0_staging/INGEST_INVENTORY.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit staged assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cc0_staging
          if git diff --cached --quiet; then echo 'No asset changes to commit.'; exit 0; fi
          git commit -m 'assets: additive ingest of reusable CC0 library'
          # The branch may receive documentation/catalog commits while downloads run.
          # Rebase the generated asset commit instead of overwriting or force-pushing history.
          git pull --rebase origin assets/cc0-staging
          git push origin HEAD:assets/cc0-staging
