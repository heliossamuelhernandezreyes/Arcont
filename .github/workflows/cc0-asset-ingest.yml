name: CC0 Asset Ingest

on:
  push:
    branches: [assets/cc0-staging]
    paths:
      - '.github/workflows/cc0-asset-ingest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: assets/cc0-staging

      - name: Install extraction helpers
        run: |
          python -m pip install --quiet gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Download deterministic CC0 packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arcont_cc0
          cd /tmp/arcont_cc0

          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o guns.zip 'https://opengameart.org/sites/default/files/ultimate_gun_pack_by_quaternius.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o animations.zip 'https://opengameart.org/sites/default/files/universal_animation_library_2standard.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o roads.zip 'https://opengameart.org/sites/default/files/kenney_city-kit-roads_0.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o industrial.zip 'https://opengameart.org/sites/default/files/kenney_city-kit-industrial_1.0.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o factory.zip 'https://opengameart.org/sites/default/files/kenney_factory-kit_3.0.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o trashcan.zip 'https://opengameart.org/sites/default/files/trashcan_yethiel.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o street_clutter.zip 'https://opengameart.org/sites/default/files/lamppostbenchtrashcan_fbx_gltf_textures_blend.zip'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -o paper_debris.zip 'https://opengameart.org/sites/default/files/paper_debris.zip'

      - name: Download Zombie Apocalypse Kit best effort
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cd /tmp/arcont_cc0
          mkdir -p zombie_drive
          timeout 75s gdown --folder 'https://drive.google.com/drive/folders/1mWP6sCHun7OUMHQeDNZLrXTteXlzWg_t?usp=sharing' -O zombie_drive
          rc=$?
          echo "Zombie pack gdown exit code: $rc"
          exit 0

      - name: Extract and organize source packs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/assets/cc0_staging"
          rm -rf "$ROOT/vendor"
          mkdir -p "$ROOT/vendor"/{weapons,animations,characters_zombies,environment_roads,environment_industrial,environment_factory,props_trashcan,props_street_clutter,props_paper}
          cd /tmp/arcont_cc0
          unzip -q guns.zip -d "$ROOT/vendor/weapons/quaternius_ultimate_guns"
          unzip -q animations.zip -d "$ROOT/vendor/animations/quaternius_universal_animation_library_2"
          unzip -q roads.zip -d "$ROOT/vendor/environment_roads/kenney_city_kit_roads"
          unzip -q industrial.zip -d "$ROOT/vendor/environment_industrial/kenney_city_kit_industrial"
          unzip -q factory.zip -d "$ROOT/vendor/environment_factory/kenney_factory_kit"
          unzip -q trashcan.zip -d "$ROOT/vendor/props_trashcan/yethiel_trashcan"
          unzip -q street_clutter.zip -d "$ROOT/vendor/props_street_clutter/loafbrr_street_clutter"
          unzip -q paper_debris.zip -d "$ROOT/vendor/props_paper/paul_wortmann_paper_debris"
          if [ -d zombie_drive ] && [ "$(find zombie_drive -type f | wc -l)" -gt 0 ]; then
            mkdir -p "$ROOT/vendor/characters_zombies/quaternius_zombie_apocalypse"
            cp -a zombie_drive/. "$ROOT/vendor/characters_zombies/quaternius_zombie_apocalypse/"
          fi

      - name: Prune duplicate authoring formats
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('assets/cc0_staging/vendor')
          # Work pack-by-pack rather than every nested directory so a local glTF folder cannot delete
          # unrelated FBX files elsewhere before we know an equivalent exists.
          packs=[]
          for category in root.iterdir():
              if not category.is_dir(): continue
              packs.extend([p for p in category.iterdir() if p.is_dir()])
          for pack in packs:
              files=[f for f in pack.rglob('*') if f.is_file()]
              has_gltf=any(f.suffix.lower() in {'.glb','.gltf'} for f in files)
              has_fbx=any(f.suffix.lower()=='.fbx' for f in files)
              if has_gltf:
                  drop={'.blend','.fbx','.obj','.mtl','.dae','.3ds','.max','.stl','.usdz'}
              elif has_fbx:
                  drop={'.blend','.obj','.mtl','.dae','.3ds','.max','.stl','.usdz'}
              else:
                  drop={'.blend','.dae','.3ds','.max','.stl','.usdz'}
              for f in files:
                  if f.suffix.lower() in drop:
                      try: f.unlink()
                      except FileNotFoundError: pass
          for f in root.rglob('*'):
              if f.is_file() and f.suffix.lower() in {'.zip','.7z','.rar'}:
                  f.unlink()
          PY

      - name: Write ingestion inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('assets/cc0_staging/vendor')
          lines=['# Generated CC0 staging inventory','', 'Generated by `cc0-asset-ingest.yml`. Do not treat these assets as production-approved until audited.','']
          total=0
          for category in sorted([p for p in root.iterdir() if p.is_dir()]):
              files=[f for f in category.rglob('*') if f.is_file()]
              size=sum(f.stat().st_size for f in files)
              total += size
              lines.append(f'## {category.name}')
              lines.append(f'- files: {len(files)}')
              lines.append(f'- size: {size/1024/1024:.2f} MiB')
              exts={}
              for f in files:
                  ext=f.suffix.lower() or '<none>'
                  exts[ext]=exts.get(ext,0)+1
              lines.append('- formats: '+(', '.join(f'{k}={v}' for k,v in sorted(exts.items())) if exts else 'none'))
              lines.append('')
          lines.append(f'**Total staged size:** {total/1024/1024:.2f} MiB')
          Path('assets/cc0_staging/INGEST_INVENTORY.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit staged assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cc0_staging
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'assets: ingest organized CC0 provisional library'
          git push origin HEAD:assets/cc0-staging
