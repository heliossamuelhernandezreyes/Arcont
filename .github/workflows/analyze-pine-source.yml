name: Analyze Pine Tree source

on:
  push:
    branches:
      - rebuild/forest-map-foundation
    paths:
      - '.github/workflows/analyze-pine-source.yml'
      - 'tools/blender/analyze_pine_source.py'
      - 'tools/blender/extract_pine_skeleton.py'
      - 'tools/blender/build_pine_structural_lod0_experiment.py'
      - 'assets/cc0/polyhaven/forest/pine_tree_01/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
          blender --version | head -n 1
      - name: Prepare Poly Haven source
        run: |
          set -euo pipefail
          SRC=/tmp/pine_tree_01
          mkdir -p "$SRC/textures"
          cp assets/cc0/polyhaven/forest/pine_tree_01/pine_tree_01_1k.gltf "$SRC/pine_tree_01_1k.gltf"
          cp assets/cc0/polyhaven/forest/pine_tree_01/*.jpg "$SRC/" || true
          cp assets/cc0/polyhaven/forest/pine_tree_01/*.png "$SRC/" || true
          curl -L --fail --retry 4 --retry-delay 3 \
            -o "$SRC/pine_tree_01.bin" \
            'https://dl.polyhaven.org/file/ph-assets/Models/gltf/8k/pine_tree_01/pine_tree_01.bin'
          test -s "$SRC/pine_tree_01.bin"
      - name: Analyze source geometry
        run: |
          set -euo pipefail
          mkdir -p build/pine-analysis
          blender --background --python tools/blender/analyze_pine_source.py -- \
            /tmp/pine_tree_01/pine_tree_01_1k.gltf \
            build/pine-analysis/pine_tree_01_analysis.json | tee build/pine-analysis/analyze.log
          grep -q 'ARCONT_PINE_ANALYSIS_OBJECTS=' build/pine-analysis/analyze.log
          grep -q 'ARCONT_PINE_ANALYSIS_TOTAL_TRIS=' build/pine-analysis/analyze.log
      - name: Extract source-derived skeleton
        run: |
          set -euo pipefail
          blender --background --python tools/blender/extract_pine_skeleton.py -- \
            /tmp/pine_tree_01/pine_tree_01_1k.gltf \
            build/pine-analysis/pine_tree_01_skeleton.json \
            build/pine-analysis/pine_tree_01_skeleton_preview.glb | tee build/pine-analysis/skeleton.log
          grep -q 'ARCONT_PINE_SKELETON_VARIANTS=' build/pine-analysis/skeleton.log
          grep -q 'ARCONT_PINE_SKELETON_PREVIEW=' build/pine-analysis/skeleton.log
          test -s build/pine-analysis/pine_tree_01_skeleton.json
          test -s build/pine-analysis/pine_tree_01_skeleton_preview.glb
      - name: Build structural LOD0 experiment
        run: |
          set -euo pipefail
          blender --background --python tools/blender/build_pine_structural_lod0_experiment.py -- \
            build/pine-analysis/pine_tree_01_skeleton.json \
            build/pine-analysis/pine_tree_01_structural_lod0.glb \
            build/pine-analysis/pine_tree_01_structural_lod0.json \
            build/pine-analysis/pine_tree_01_structural_lod0.png | tee build/pine-analysis/structural_lod0.log
          grep -q 'ARCONT_PINE_STRUCTURAL_EXPERIMENT=' build/pine-analysis/structural_lod0.log
          grep -q 'ARCONT_PINE_STRUCTURAL_PREVIEW=' build/pine-analysis/structural_lod0.log
          test -s build/pine-analysis/pine_tree_01_structural_lod0.glb
          test -s build/pine-analysis/pine_tree_01_structural_lod0.json
          test -s build/pine-analysis/pine_tree_01_structural_lod0.png
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: pine-tree-source-analysis
          path: build/pine-analysis/
          retention-days: 14
