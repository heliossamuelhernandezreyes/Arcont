name: Build mobile pine LODs

on:
  push:
    branches:
      - rebuild/forest-map-foundation
    paths:
      - 'tools/blender/decimate_pine_tree.py'
      - '.github/workflows/build-mobile-pine-lods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pine-lods:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/forest-map-foundation

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version | head -n 1

      - name: Prepare Poly Haven source
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/pine_tree_01
          mkdir -p "$SRC/textures"
          cp assets/cc0/polyhaven/forest/pine_tree_01/pine_tree_01_1k.gltf "$SRC/pine_tree_01_1k.gltf"
          cp assets/cc0/polyhaven/forest/pine_tree_01/*.jpg "$SRC/textures/"
          curl -L --fail --retry 4 --retry-delay 3 \
            -o "$SRC/pine_tree_01.bin" \
            'https://dl.polyhaven.org/file/ph-assets/Models/gltf/8k/pine_tree_01/pine_tree_01.bin'
          test -s "$SRC/pine_tree_01.bin"
          du -h "$SRC/pine_tree_01.bin"

      - name: Build LOD0 LOD1 LOD2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/runtime/forest/pine_tree_01
          mkdir -p assets/runtime/forest/pine_tree_01
          blender --background --python tools/blender/decimate_pine_tree.py -- \
            /tmp/pine_tree_01/pine_tree_01_1k.gltf \
            assets/runtime/forest/pine_tree_01 | tee pine_lod_build.log
          grep -q 'ARCONT_TREE_LOD0_MAX_PER_TREE=' pine_lod_build.log
          grep -q 'ARCONT_TREE_LOD1_MAX_PER_TREE=' pine_lod_build.log
          grep -q 'ARCONT_TREE_LOD2_MAX_PER_TREE=' pine_lod_build.log
          ls -lh assets/runtime/forest/pine_tree_01/*.glb

      - name: Record provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > assets/runtime/forest/pine_tree_01/README.md <<'EOF'
          # Pine Tree 01 — Arcont mobile derivatives

          Source: Poly Haven `pine_tree_01`, CC0 1.0.
          Source page: https://polyhaven.com/a/pine_tree_01
          These GLB files are generated derivatives for Arcont's mobile runtime.

          Intended per-tree triangle ceilings:
          - LOD0: 30,000 triangles — very near / hero range.
          - LOD1: 10,000 triangles — medium range.
          - LOD2: 3,000 triangles — far range before impostor/HLOD.

          Generated by `tools/blender/decimate_pine_tree.py`.
          The original ~905 MiB source buffer is not committed to the runtime repository.
          EOF
          sha256sum assets/runtime/forest/pine_tree_01/*.glb > assets/runtime/forest/pine_tree_01/SHA256SUMS.txt

      - name: Commit mobile derivatives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime/forest/pine_tree_01
          if git diff --cached --quiet; then
            echo 'No mobile tree derivative changes.'
            exit 0
          fi
          git commit -m 'assets(forest): build mobile pine LODs'
          git push origin HEAD:rebuild/forest-map-foundation
