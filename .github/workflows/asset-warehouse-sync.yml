name: Realistic Asset Warehouse Sync

on:
  push:
    branches: ["research/reference-lab"]
    paths:
      - "tools/asset_warehouse/**"
      - ".github/workflows/asset-warehouse-sync.yml"
      - "research/REALISTIC_ASSET_WAREHOUSE.md"
  workflow_dispatch:
    inputs:
      download:
        description: "Download selected source files (catalog-only when false)"
        required: true
        default: false
        type: boolean
      resolution:
        description: "Preferred source resolution for downloaded files"
        required: true
        default: "4k"
        type: choice
        options: ["1k", "2k", "4k", "8k", "16k", "24k"]
      file_mode:
        description: "How broadly to download each matched asset"
        required: true
        default: "representative"
        type: choice
        options: ["single", "representative", "all"]
      limit:
        description: "Max matched assets; 0 catalogs all matches"
        required: true
        default: "0"
        type: string
      max_total_gb:
        description: "Safety cap for this run's binary downloads"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  polyhaven:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build complete Poly Haven catalog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DOWNLOAD: ${{ inputs.download || false }}
          INPUT_RESOLUTION: ${{ inputs.resolution || '4k' }}
          INPUT_FILE_MODE: ${{ inputs.file_mode || 'representative' }}
          INPUT_LIMIT: ${{ inputs.limit || '0' }}
          INPUT_MAX_TOTAL_GB: ${{ inputs.max_total_gb || '20' }}
        run: |
          set -euo pipefail
          EXTRA=""
          # Push events are catalog-only. Binary acquisition is always an explicit manual action.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_DOWNLOAD" == "true" ]]; then
            EXTRA="--download"
          fi
          python tools/asset_warehouse/fetch_polyhaven.py \
            --out warehouse/polyhaven \
            --resolution "$INPUT_RESOLUTION" \
            --file-mode "$INPUT_FILE_MODE" \
            --limit "$INPUT_LIMIT" \
            --max-total-gb "$INPUT_MAX_TOTAL_GB" \
            $EXTRA

      - name: Inventory assets already present in repository checkout
        shell: bash
        run: |
          python tools/asset_warehouse/inventory_repo_assets.py \
            --root . \
            --out warehouse/repo_inventory

      - name: Warehouse summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('warehouse/polyhaven/catalog.json').read_text())
          a=json.loads(Path('warehouse/polyhaven/acquisitions.json').read_text())
          i=json.loads(Path('warehouse/repo_inventory/inventory.json').read_text())
          print(f"polyhaven_catalog_count={c['count']}")
          print(f"download_records={a['count']}")
          print(f"downloaded_bytes={a['downloaded_bytes']}")
          print(f"repo_asset_count={i['summary']['asset_count']}")
          print(f"repo_asset_bytes={i['summary']['total_bytes']}")
          PY

      - name: Upload catalog, inventory and optional masters
        uses: actions/upload-artifact@v4
        with:
          name: arcont-realistic-warehouse-${{ github.run_id }}
          path: warehouse
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
