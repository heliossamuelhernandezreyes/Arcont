name: Structured Godot Editing Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structured-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout ARCONT
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 unzip
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Run fresh-project structured gameplay acceptance
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          rm -rf /tmp/arcont-structured-game
          mkdir -p /tmp/arcont-structured-game structured-godot-evidence
          python tests/structured_godot_live_acceptance.py             --arcont "$PWD"             --project /tmp/arcont-structured-game             --evidence "$PWD/structured-godot-evidence"

      - name: Import final generated project in Godot
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          "$GODOT_BIN" --headless --path /tmp/arcont-structured-game --editor --import --quit > structured-godot-evidence/final-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' structured-godot-evidence/final-import.log; then
            cat structured-godot-evidence/final-import.log
            exit 1
          fi

      - name: Preserve structured editing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcont-structured-godot-${{ github.sha }}
          path: structured-godot-evidence/
          include-hidden-files: true
          retention-days: 30
