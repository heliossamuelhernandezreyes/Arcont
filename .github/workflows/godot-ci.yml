name: Godot CI

on:
  push:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/godot-ci.yml'
  pull_request:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/godot-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl -L --fail --retry 3 \
            -o /tmp/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Structural smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_test.gd

      - name: Boot main scene briefly
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --quit-after 120 || exit $?
