name: Asset Vault Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/asset-vault-sync.yml'
      - 'tools/asset_vault_indexer.py'
      - 'tools/asset_vault_bulk_sync.py'
      - 'tools/google_fonts_adapter.py'
      - 'tools/kenney_adapter.py'
      - 'tools/license_policy.py'
      - 'tools/opengameart_adapter.py'
      - 'tools/arcont_lab.py'
      - 'tools/arcont_hardening.py'
      - 'assets/sources/opengameart-seeds.json'
      - 'schemas/asset-record.schema.json'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: asset-vault-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Poly Haven metadata
        run: python tools/asset_vault_bulk_sync.py

      - name: Fetch Google Fonts metadata without font binaries
        shell: bash
        run: |
          rm -rf /tmp/google-fonts
          git clone --depth 1 --filter=blob:limit=16384 --no-checkout https://github.com/google/fonts.git /tmp/google-fonts
          status=0
          python tools/google_fonts_adapter.py /tmp/google-fonts --root . || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Sync Kenney CC0 metadata
        shell: bash
        run: |
          status=0
          python tools/kenney_adapter.py --root . || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Sync OpenGameArt GREEN metadata
        shell: bash
        run: |
          status=0
          python tools/opengameart_adapter.py --root . || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Rebuild stable Asset Vault index
        run: python tools/asset_vault_bulk_sync.py

      - name: Validate complete ARCONT integrity before publication
        run: |
          python tools/arcont_lab.py validate
          python tools/arcont_hardening.py validate
          python tools/asset_vault_indexer.py validate
          python tools/asset_vault_indexer.py build --output /tmp/arcont-asset-index.json
          python -m unittest discover -s tests -v

      - name: Negative control - invalid benchmark result must fail
        shell: bash
        run: |
          cat > /tmp/invalid.result.json <<'JSON'
          {"schema_version":1,"benchmark_id":"ARC-BAD","run_id":"bad","engine":{"name":"godot","version":"4.7.2-stable","commit":"bad"},"platform":{},"runtime":{},"experiment":{},"metrics":{},"aborted":true}
          JSON
          if python tools/arcont_hardening.py validate-result /tmp/invalid.result.json; then
            echo "Validator accepted deliberately invalid evidence"
            exit 1
          fi

      - name: Negative control - maturity overclaim must fail
        shell: bash
        run: |
          if python tools/arcont_hardening.py maturity L7_VALIDATED_RULE --source-traced --hypothesis --observations 1 --validated-rule; then
            echo "Maturity validator accepted an unsupported L7 claim"
            exit 1
          fi

      - name: Negative control - illegal mirrored asset must fail
        shell: bash
        run: |
          mkdir -p /tmp/arcont-vault/assets/catalog/test
          cat > /tmp/arcont-vault/assets/catalog/test/bad.asset.json <<'JSON'
          {"schema_version":1,"id":"ARC-ASSET-BAD-001","title":"Bad","asset_type":"3d","source":{"provider":"Test","asset_url":"https://example.invalid/bad"},"license":{"name":"TEST","redistribution_allowed":false},"technical":{},"compatibility":{},"archive":{"mirrored_in_arcont":true,"sha256":null},"review":{"license_verified":true}}
          JSON
          if python tools/asset_vault_indexer.py validate --root /tmp/arcont-vault; then
            echo "Asset validator accepted illegal mirroring"
            exit 1
          fi

      - name: Commit synchronized metadata
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo 'No Asset Vault changes.'
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main advanced while this sync was running; skipping stale publication.'
            echo 'A newer Asset Vault run will regenerate from the newer main.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'chore(assets): synchronize open asset metadata'
          git push origin HEAD:main
