name: Asset Vault Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/asset-vault-sync.yml'
      - 'tools/asset_vault_indexer.py'
      - 'tools/asset_vault_bulk_sync.py'
      - 'tools/google_fonts_adapter.py'
      - 'tools/kenney_adapter.py'
      - 'schemas/asset-record.schema.json'

permissions:
  contents: write

concurrency:
  group: asset-vault-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ARCONT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Poly Haven metadata
        run: python tools/asset_vault_bulk_sync.py

      - name: Fetch Google Fonts metadata without font binaries
        shell: bash
        run: |
          rm -rf /tmp/google-fonts
          git clone --depth 1 --filter=blob:limit=16384 --no-checkout https://github.com/google/fonts.git /tmp/google-fonts
          status=0
          python tools/google_fonts_adapter.py /tmp/google-fonts --root . || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Sync Kenney CC0 metadata
        shell: bash
        run: |
          status=0
          python tools/kenney_adapter.py --root . || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Rebuild stable Asset Vault index
        run: python tools/asset_vault_bulk_sync.py

      - name: Validate Asset Vault
        run: |
          python tools/asset_vault_indexer.py validate
          python -m unittest discover -s tests -v

      - name: Commit synchronized metadata
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo 'No Asset Vault changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'chore(assets): synchronize open asset metadata'
          git pull --rebase origin main
          git push origin HEAD:main
